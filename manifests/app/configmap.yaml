apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>k8s_oci</title>
        <style>
          body {
            font-family: system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #e2e8f0;
          }
          main {
            max-width: 42rem;
            padding: 2rem;
            line-height: 1.5;
          }
          h1 {
            margin: 0 0 1rem;
            font-size: 2rem;
          }
          p {
            margin: 0.75rem 0;
          }
        </style>
      </head>
      <body>
        <main>
          <h1>k8s_oci</h1>
          <p>Self-hosted Kubernetes website on fsck.me.uk.</p>
          <p>HTTPS, OCI images, and a lean k3s cluster.</p>
        </main>
      </body>
    </html>

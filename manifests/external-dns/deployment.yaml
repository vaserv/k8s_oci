apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.1
          imagePullPolicy: IfNotPresent
          args:
            - --source=ingress
            - --provider=cloudflare
            - --registry=txt
            - --txt-owner-id=server1.fsck.me.uk
            - --domain-filter=fsck.me.uk
            - --domain-filter=rghf.nl
            - --policy=sync
            - --interval=1m
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: external-dns-cloudflare
                  key: CF_API_TOKEN

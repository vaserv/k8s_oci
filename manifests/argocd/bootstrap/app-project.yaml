apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: k8s-oci
  namespace: default
spec:
  description: GitOps project for the k8s_oci workloads
  sourceRepos:
    - https://github.com/vaserv/k8s_oci.git
  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: k8s-oci
      server: https://kubernetes.default.svc
    - namespace: jellyfin
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

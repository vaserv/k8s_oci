apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-oci-bootstrap
  namespace: default
spec:
  project: k8s-oci
  source:
    repoURL: https://github.com/vaserv/k8s_oci.git
    targetRevision: main
    path: manifests/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

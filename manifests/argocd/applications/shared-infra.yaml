apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: k8s-oci
  source:
    repoURL: https://github.com/vaserv/k8s_oci.git
    targetRevision: main
    path: manifests/argocd/workloads/shared-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-oci
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

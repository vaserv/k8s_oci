apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: k8s-oci
  source:
    repoURL: https://github.com/vaserv/k8s_oci.git
    targetRevision: main
    path: manifests/argocd/workloads/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

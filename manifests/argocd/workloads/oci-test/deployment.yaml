apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-test
  template:
    metadata:
      labels:
        app: oci-test
    spec:
      containers:
        - name: oci-test
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: html-content
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: html-content
          image:
            reference: ghcr.io/vaserv/k8s-oci-hello-html:latest
            pullPolicy: IfNotPresent
        - name: nginx-config
          configMap:
            name: oci-test-nginx-config

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - example.invalid
      secretName: site-tls
  rules:
    - host: example.invalid
      http:
        paths:
          - path: /webpages
            pathType: Prefix
            backend:
              service:
                name: site
                port:
                  number: 80
